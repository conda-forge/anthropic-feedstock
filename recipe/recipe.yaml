schema_version: 1

context:
  name: anthropic
  version: 1.6.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/anthropics/anthropic-sdk-python/archive/v${{ version }}.tar.gz
  sha256: 3d3297fc5c0441a3d6348134a6fbdcf4197ccca47dd92e261578c1153beed6ca

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core >=1.0.0
    - hatch-fancy-pypi-readme
    - hatchling
    - pip
  run:
    - httpx2 >=2.0.0,<3
    - docstring_parser >=0.15,<1
    - typing_extensions >=4.14,<5
    - python >=${{ python_min }},<4.0.0
    - pydantic >=1.9.0,<3
    - anyio >=4.1.0,<5
    - sniffio >=1,<2
    - jiter >=0.4.0,<1
tests:
  - python:
      imports:
        - anthropic
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  license: MIT
  license_file: LICENSE
  summary: Library for accessing the anthropic API
  homepage: https://github.com/anthropics/anthropic-sdk-python
  documentation: https://console.anthropic.com/docs

extra:
  recipe-maintainers:
    - jan-janssen
    - mikelambert
    - moritzwilksch
    - siboehm
    - x5a
